# LSF resources per rule for ~/bin/snakejob; run from the folder that holds the Snakefile
# mem is per core: a job's total memory is cores x mem. cores should match the threads the rule uses
__default__:
  queue: express
  cores: 8
  mem: 3000
  time: '120'
  name: $(basename $(pwd)):{rule}:{wildcards}
  output: logs/{rule}:{wildcards}.stdout
  error: logs/{rule}:{wildcards}.stderr
  himem: ""

pychopper:
  cores: 8
  mem: 16000
  time: 360
  queue: premium

build_junc_bed:
  cores: 1
  mem: 8000
  time: 60
  queue: express

nanopore_alignment:
  cores: 8
  mem: 32000
  time: 360
  queue: premium
  himem: "-R himem"

cram_to_qc_bam:
  cores: 4

samtools_qc:
  cores: 1
  mem: 3000
  time: 60
  queue: express

# the nanostat rules run with 4 threads; highest v9 peak was 7.6 GB, against 12 GB here (4 x the default 3000)
nanostat_raw:
  cores: 4

nanostat_pychopper:
  cores: 4

nanostat_aligned:
  cores: 4

# 120 min was too short for the deepest library. picard used about one core at v9 (cpu time equals run time);
# total memory stays 64 GB as at v9, peak was 15.8 GB
picard:
  cores: 1
  mem: 64000
  time: 360
  queue: express

read_lengths:
  cores: 1
  mem: 8000
  time: 60
  queue: express

longread_qc_tables:
  cores: 1
  mem: 8000
  time: 60
  queue: express

multiQC:
  cores: 1
  mem: 8000
  time: 60
  queue: express

pool_group_bams:
  cores: 4
  mem: 1000
  time: 720

bambu_create_annotation:
  cores: 1
  mem: 64000
  time: 360
  queue: premium
  himem: "-R himem"

run_bambu:
  cores: 1
  mem: 80000
  time: 72:00
  queue: premium
  himem: "-R himem"

run_isoquant:
  cores: 8
  mem: 20000
  time: 144:00
  queue: premium
  himem: "-R himem"

stringtie_pool_short_bams:
  cores: 4
  mem: 1000
  time: 120

run_stringtie:
  cores: 4
  mem: 6000
  time: 720

# gffcompare holds the whole union and the reference in memory
consensus_isoforms:
  cores: 4
  mem: 16000
  time: 240
  queue: premium

# the input is a gtf, so sqanti aligns nothing: one core
sqanti_qc:
  cores: 1
  mem: 16000
  time: 720
  queue: premium

sqanti_filter:
  cores: 1
  mem: 16000
  time: 120
  queue: express

cross_cohort_genes:
  cores: 1
  mem: 16000
  time: 120
  queue: express

cross_cohort_fasta:
  cores: 2
  mem: 12000
  time: 120
  queue: express
