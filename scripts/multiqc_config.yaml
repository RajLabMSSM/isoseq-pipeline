# settings for the long-read MultiQC page. the pipeline's own panels (the *_mqc.tsv files from longread_qc_tables.py)
# replace the parts of MultiQC's output that are built for short reads or that count differently from those panels.

# picard names its samples after the input bam ("CTRL1.qc"); dropping ".qc" keeps one row per library in the tables
extra_fn_clean_exts:
  - ".qc"

remove_sections:
  # pychopper's classification plot counts a rescued read once per segment; the panel "Pychopper read classes" shows
  # the same classes in read units. the module's strand orientation plot stays
  - pychopper_classification
  # flagstat: every paired-end field is 0 on long reads, and "mapped" counts supplementary records, so it is a count of
  # alignment records, not of reads. the read flow panels give reads
  - samtools-flagstat

# general statistics table: hide the columns the pipeline's own columns replace, so each number appears once.
# "Full-Length cDNA" uses pychopper's percentage, which leaves out reads failing the quality filter
table_columns_visible:
  Pychopper:
    ftp: false
  "Samtools: flagstat": false
