# cluster.yaml
# LSF job submission parameters for isoseq-pipeline
# Place this file in the pipeline directory (where the Snakefile lives)
# Always run snakejob from the pipeline directory

__default__:
  queue: express
  cores: 8
  mem: 3000
  time: '120'
  name: $(basename $(pwd)):{rule}:{wildcards}
  output: logs/{rule}:{wildcards}.stdout
  error: logs/{rule}:{wildcards}.stderr
  himem: ""

