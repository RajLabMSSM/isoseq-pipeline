# LSF resources per rule for ~/bin/snakejob; run from the folder that holds the Snakefile
__default__:
  queue: express
  cores: 8
  mem: 3000
  time: '120'
  name: $(basename $(pwd)):{rule}:{wildcards}
  output: logs/{rule}:{wildcards}.stdout
  error: logs/{rule}:{wildcards}.stderr
  himem: ""

pychopper:
  cores: 8
  mem: 16000
  time: 360
  queue: premium

build_junc_bed:
  cores: 1
  mem: 8000
  time: 60
  queue: express

